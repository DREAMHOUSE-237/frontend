name: Build

# Vérifie seulement que le site compile. Le déploiement est fait par
# Render et Vercel, indépendamment de ce workflow.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
